name: 'Run tests'
description: 'Run the test application with common arguments'
author: 'Jared Parsons <jared@paranoidcoding.org>'
inputs:
  name:
    description: 'Name of the test run'
    required: true
  framework:
    description: 'Target framework to test'
    required: true
  test-results-dir:
    description: 'Path to store the test results'
    required: true
  test-coverage-dir:
    description: 'Path to store the test coverage'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Test ${{ inputs.name }}
      run: |
        dotnet run --project src/Basic.CompilerLog.UnitTests/Basic.CompilerLog.UnitTests.csproj `
          --no-build --framework ${{ inputs.framework }} -- `
          --hangdump --hangdump-type-if-supported full --hangdump-timeout 10m `
          --results-directory "${{ inputs.test-results-dir }}" `
          --output Detailed `
          --report-xunit-trx `
          --report-xunit-trx-filename TestResults-${{ inputs.name }}.trx `
          --coverlet --coverlet-output-format cobertura `
          --coverlet-file-prefix coverage.${{ inputs.name }} `
          --coverlet-include "[Basic.CompilerLog]*" `
          --coverlet-include "[Basic.CompilerLog.App]*" `
          --coverlet-include "[Basic.CompilerLog.Util]*"
        $testExitCode = $LASTEXITCODE

        $coverageFiles = @(Get-ChildItem -Path "${{ inputs.test-results-dir }}" -Filter 'coverage.${{ inputs.name }}.coverage.cobertura.*.xml')
        if ($testExitCode -eq 0 -and $coverageFiles.Count -eq 0) {
          throw 'The test run did not produce a coverage report.'
        }

        $coverageFiles | Copy-Item -Destination "${{ inputs.test-coverage-dir }}"
        exit $testExitCode
      shell: pwsh
